groups:
  - name: social_trading_risk
    interval: 30s
    rules:
      - alert: CircuitBreakerHalted
        expr: circuit_breaker_state >= 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker is in HALT state ({{ $value }})"
          description: "Circuit breaker transitioned to DAILY_HALT or FULL_HALT. All trading is suspended."

      - alert: HighDrawdown
        expr: drawdown_from_hwm > 0.08
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Drawdown exceeding 8% ({{ $value | humanizePercentage }})"
          description: "Portfolio drawdown from high-water mark has exceeded 8% for 5 minutes."

      - alert: CriticalDrawdown
        expr: drawdown_from_hwm > 0.12
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical drawdown {{ $value | humanizePercentage }}"
          description: "Portfolio drawdown has breached 12%. Manual intervention may be required."

      - alert: NegativeDailyPnL
        expr: daily_pnl_pct < -0.02
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Daily P&L below -2% ({{ $value | humanizePercentage }})"
          description: "Daily P&L has been below -2% for 10 minutes."

  - name: social_trading_ingestion
    interval: 60s
    rules:
      - alert: IngestStalled
        expr: rate(posts_ingested_total[5m]) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Post ingestion has stalled for 10 minutes"
          description: "No posts have been ingested in the last 10 minutes. Check data sources and API credentials."

      - alert: HighIngestErrorRate
        expr: rate(ingest_errors_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High ingest error rate ({{ $value | humanize }}/s)"
          description: "Data source is producing errors at >0.5/s for 5 minutes."

  - name: social_trading_nlp
    interval: 60s
    rules:
      - alert: NLPLatencyHigh
        expr: histogram_quantile(0.95, rate(sentiment_latency_ms_bucket[5m])) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NLP p95 latency above 1s"
          description: "NLP pipeline p95 latency has been above 1000ms for 5 minutes. Consider reducing batch size."

      - alert: NLPStalled
        expr: rate(posts_classified_total[5m]) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "NLP pipeline has produced no output for 15 minutes"
          description: "Check NLP service and raw_social stream consumer group."

  - name: social_trading_signals
    interval: 60s
    rules:
      - alert: SignalGenerationStalled
        expr: rate(signals_generated_total[15m]) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "No signals generated in 30 minutes"
          description: "Signal generator has not produced any signals. This may be normal in low-activity markets."

      - alert: AllSignalsRejected
        expr: |
          rate(signals_rejected_total[15m]) > 0
          and
          rate(signals_approved_total[15m]) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "All signals are being rejected by risk filters"
          description: "Signals are generated but 100% are rejected. Check circuit breaker, liquidity gate, and position sizer config."
