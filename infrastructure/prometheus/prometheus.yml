global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "ingest"
    static_configs:
      - targets: ["ingest:8000"]

  - job_name: "nlp"
    static_configs:
      - targets: ["nlp:8000"]

  - job_name: "signal"
    static_configs:
      - targets: ["signal:8000"]

  - job_name: "risk"
    static_configs:
      - targets: ["risk:8000"]

  - job_name: "execution"
    static_configs:
      - targets: ["execution:8000"]
